name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build UTM iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout UTM
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Download Prebuilt Sysroot
        run: |
          mkdir -p sysroot-ios-arm64
          curl -L -o sysroot.tar.gz https://github.com/utmapp/UTM/releases/download/v4.5.3/sysroot-ios-arm64.tar.gz || true
          if [ -f sysroot.tar.gz ]; then
            tar -xzf sysroot.tar.gz -C sysroot-ios-arm64
          fi

      - name: Install Dependencies
        run: |
          brew install bison pkg-config glib-utils nasm meson
          pip3 install --break-system-packages six pyparsing mako || pip3 install six pyparsing mako

      - name: Build UTM (.ipa)
        run: |
          xcodebuild archive \
            -workspace UTM.xcworkspace \
            -scheme UTM \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/UTM.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p build/Payload
          cp -r build/UTM.xcarchive/Products/Applications/UTM.app build/Payload/
          cd build
          zip -r UTM-Android.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-Android-IPA
          path: build/UTM-Android.ipa
