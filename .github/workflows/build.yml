name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout UTM
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Build Tools
        run: |
          brew install bison pkg-config nasm ninja meson
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          pip3 install --break-system-packages setuptools pyparsing six distlib wheel packaging pyyaml mako jinja2

      - name: Patch and Build Dependencies
        run: |
          # 1. Ejecutar un monitor en segundo plano que espera a que el código
          #    se descargue y le aplica el parche antes de compilarlo.
          (
            while true; do
              if [ -f "build-iOS-arm64/virglrenderer.git/src/vrend/vrend_renderer.c" ]; then
                sleep 3
                sed -i '' 's/char \*llvmpipe_string = strstr(caps->v2.renderer, "llvmpipe");/{ char *llvmpipe_string = strstr(caps->v2.renderer, "llvmpipe");/g' build-iOS-arm64/virglrenderer.git/src/vrend/vrend_renderer.c
                sed -i '' 's/memcpy(llvmpipe_string, "LLVMPIPE", 8);/memcpy(llvmpipe_string, "LLVMPIPE", 8); }/g' build-iOS-arm64/virglrenderer.git/src/vrend/vrend_renderer.c
                break
              fi
              sleep 3
            done
          ) &

          # 2. Iniciar la compilación (el monitor de arriba lo parchará en vuelo)
          ./scripts/build_dependencies.sh -p ios -a arm64

      - name: Build UTM (.ipa)
        run: |
          xcodebuild archive \
            -workspace UTM.xcworkspace \
            -scheme "UTM (iOS)" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/UTM.xcarchive \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/UTM.xcarchive/Products/Applications/UTM.app Payload/
          zip -r UTM.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-Custom
          path: UTM.ipa
