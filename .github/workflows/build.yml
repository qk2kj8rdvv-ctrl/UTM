name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout UTM
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Build Tools
        run: |
          brew install bison pkg-config nasm ninja meson
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          pip3 install --break-system-packages setuptools pyparsing six distlib wheel packaging pyyaml mako jinja2

      - name: Patch and Build Dependencies
        run: |
          # Modificar el script para parchar virglrenderer apenas se descargue
          python3 -c '
          with open("scripts/build_dependencies.sh", "r") as f:
              content = f.read()
          # Insertar correccion de sintaxis C en vrend_renderer.c
          patch_cmd = """
          if [ -f "$BUILD_DIR/virglrenderer.git/src/vrend/vrend_renderer.c" ]; then
              sed -i "" "s/char \*llvmpipe_string = strstr/{ char *llvmpipe_string = strstr/" "$BUILD_DIR/virglrenderer.git/src/vrend/vrend_renderer.c"
              sed -i "" "s/memcpy(llvmpipe_string, \"LLVMPIPE\", 8);/memcpy(llvmpipe_string, \"LLVMPIPE\", 8); }/" "$BUILD_DIR/virglrenderer.git/src/vrend/vrend_renderer.c"
          fi
          """
          content = content.replace("build_virglrenderer() {", "build_virglrenderer() {\n" + patch_cmd)
          with open("scripts/build_dependencies.sh", "w") as f:
              f.write(content)
          '
          ./scripts/build_dependencies.sh -p ios -a arm64

      - name: Build UTM (.ipa)
        run: |
          xcodebuild archive \
            -workspace UTM.xcworkspace \
            -scheme "UTM (iOS)" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/UTM.xcarchive \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/UTM.xcarchive/Products/Applications/UTM.app Payload/
          zip -r UTM.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-Custom
          path: UTM.ipa
