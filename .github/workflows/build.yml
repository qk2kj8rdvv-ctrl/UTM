name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout UTM
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install Build Tools
        run: |
          brew install bison pkg-config nasm
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          pip3 install six distlib

      - name: Build Dependencies
        run: |
          ./scripts/build_dependencies.sh -p ios -a arm64

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Tools & Python Packages
        run: |
          brew install bison pkg-config glib-utils nasm meson
          echo "/opt/homebrew/opt/bison/bin:/usr/local/opt/bison/bin" >> $GITHUB_PATH
          python3 -m pip install --break-system-packages setuptools six pyparsing mako pyyaml distlib

      - name: Fetch Prebuilt Sysroot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sysroot-ios-arm64
          # Descarga el asset oficial del repositorio de dependencias de UTM
          gh release download --repo utmapp/UTM-dependencies -p "*ios-arm64*" --dir . || \
          gh release download --repo utmapp/UTM-dependencies -p "*ios*" --dir .
          
          # Extraer el archivo descargado
          ARCHIVE=$(ls *.tgz *.tar.gz *.zip 2>/dev/null | head -n 1)
          if [[ "$ARCHIVE" == *.tar.gz ]] || [[ "$ARCHIVE" == *.tgz ]]; then
            tar -xzf "$ARCHIVE" -C sysroot-ios-arm64
          elif [[ "$ARCHIVE" == *.zip ]]; then
            unzip -q "$ARCHIVE" -d sysroot-ios-arm64
          fi
          ls -la sysroot-ios-arm64
      - name: Build UTM (.ipa)
        run: |
          xcodebuild archive \
            -workspace UTM.xcworkspace \
            -scheme UTM \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/UTM.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p build/Payload
          cp -r build/UTM.xcarchive/Products/Applications/UTM.app build/Payload/
          cd build
          zip -r UTM-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-iOS-IPA
          path: build/UTM-iOS.ipa
