name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout UTM
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Fetch Prebuilt Sysroot
        run: |
          curl -L -o sysroot.zip https://github.com/utmapp/UTM/releases/download/v4.5.3/sysroot-ios-arm64.zip
          unzip -q sysroot.zip

      - name: Build UTM (.ipa)
        run: |
          xcodebuild archive \
            -workspace UTM.xcworkspace \
            -scheme "UTM (iOS)" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/UTM.xcarchive \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/UTM.xcarchive/Products/Applications/UTM.app Payload/
          zip -r UTM.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-Custom
          path: UTM.ipa
