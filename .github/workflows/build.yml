name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build UTM iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout UTM
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install Python & Tools
        run: |
          brew install bison pkg-config glib-utils nasm meson
          python3 -m pip install --break-system-packages setuptools six pyparsing mako pyyaml

      - name: Build Dependencies (Sysroot iOS)
        run: |
          ./scripts/build_dependencies.sh -p ios -a arm64

      - name: Build UTM (.ipa)
        run: |
          xcodebuild archive \
            -workspace UTM.xcworkspace \
            -scheme UTM \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/UTM.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p build/Payload
          cp -r build/UTM.xcarchive/Products/Applications/UTM.app build/Payload/
          cd build
          zip -r UTM-Android.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTM-Android-IPA
          path: build/UTM-Android.ipa
